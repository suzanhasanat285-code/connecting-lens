<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عدسة الربط | اربط الوسم بوظيفته</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--red:#8a0000;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;touch-action:manipulation}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 10% 0,#dbe7ff,transparent 45%),radial-gradient(circle at 95% 10%,#e6d9ff,transparent 40%),#eef4fb;font-family:Cairo,Tahoma,sans-serif;color:var(--ink);padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
h1{text-align:center;font-size:clamp(30px,5vw,56px);margin:4px 0;background:linear-gradient(90deg,#1e3a8a,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.q{text-align:center;color:var(--red);font-weight:800;font-size:clamp(16px,2.6vw,26px);margin:0 0 10px}
.tip{text-align:center;font-size:14px;opacity:.7;margin-bottom:10px}
.wrap{max-width:1100px;margin:0 auto}
.tray{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:10px;min-height:80px}
.chip{background:#fff;border:3px solid #94a3d8;border-radius:14px;padding:14px 20px;font-weight:800;font-size:clamp(16px,2.2vw,24px);cursor:grab;box-shadow:0 6px 16px rgba(30,50,120,.18);user-select:none;touch-action:none}
.chip.dragging{opacity:.35}
.frame{position:relative;background:#fff;border:5px solid #444;border-radius:10px;padding:16px 4vw;margin:8px 0}
.inner{border:3px solid #6b7ba8;border-radius:8px;padding:26px 3vw;background:#eaf1fb}
.cols{display:flex;align-items:center}
.lead{width:min(150px,16vw);flex:none;display:flex;align-items:center;justify-content:center}
.fourcols{flex:1;display:flex;gap:12px}
.fourcols>*{flex:1;min-width:0}
.fixedbox{height:64px;border:3px solid #33415c;border-radius:14px;background:#dfe7fb;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(14px,2vw,22px);font-family:Consolas,monospace;direction:ltr}
.slot{height:64px;border:3px dashed #7b8bc4;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(13px,1.8vw,19px);position:relative;transition:.15s}
.slot.filled{border-style:solid}
.mark{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:800;white-space:nowrap}
.slot.flash-bad{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ribs-row{position:relative;margin:18px 0}
.spine{position:absolute;height:9px;background:linear-gradient(90deg,#33415c,#1c2438);border-radius:5px;top:50%;transform:translateY(-50%);right:calc(min(150px,16vw) - 4px);left:14px}
.circle{width:min(130px,15vw);height:min(130px,15vw);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7ea,#e4b988 75%);border:3px solid #333;box-shadow:0 10px 22px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#8a2c0d;font-size:clamp(11px,1.6vw,15px);line-height:1.25;padding:6px}
.rib{width:7px;height:100px;margin:0 auto;border-radius:4px;background:linear-gradient(180deg,#8f9fc9,#333,#8f9fc9)}
#win{position:fixed;inset:0;background:rgba(20,33,61,.55);display:none;align-items:center;justify-content:center;z-index:60;text-align:center}
#win.on{display:flex}
#win .box{background:#fff;border-radius:24px;padding:40px 30px}
#win .box h2{font-size:clamp(28px,5vw,48px);font-weight:800;color:var(--ok);margin:0 0 16px}
.mainbtn{font:inherit;font-weight:800;font-size:16px;padding:10px 22px;border:0;border-radius:99px;background:#fff;box-shadow:0 4px 12px rgba(20,33,61,.2);cursor:pointer}
#reset{display:block;margin:14px auto 0;position:relative;z-index:5}
.prog{text-align:center;font-weight:800;margin-top:6px}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:99;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
</style></head><body>
<div class="wrap">
<h1>عدسة الربط</h1>
<p class="q">باستخدام عدسة الربط: اربط بين الوسم وبين وظيفته</p>
<p class="tip">الوسوم ثابتة في الأعلى — اسحب كل مربع من الأسفل إلى مكانه الصحيح 👆</p>
<div class="frame"><div class="inner">
 <div class="cols" id="topSlots"><div class="lead"></div><div class="fourcols"></div></div>
 <div class="cols ribs-row"><div class="lead"><div class="circle">الكود ← ماذا يصنع؟</div></div><div class="fourcols" id="ribwrap"></div><div class="spine"></div></div>
 <div class="cols" id="botSlots"><div class="lead"></div><div class="fourcols"></div></div>
</div></div>
<div class="tray" id="botTray"></div>
<div class="prog" id="prog">0 / 4</div>
<button id="reset" class="mainbtn">🔄 إعادة المحاولة</button>
</div>
<div id="win"><div class="box"><h2>🎉 أبدعت!</h2><button id="resetWin" class="mainbtn">🔄 إعادة المحاولة</button></div></div>
<script>
const PAIRS=[{k:'img',t:'&lt;img&gt;',b:'🖼️ إدراج الصورة'},{k:'src',t:'src',b:'🔗 تحديد مصدر الصورة'},{k:'hr',t:'&lt;hr&gt;',b:'➖ ظهور الخط'},{k:'color',t:'color',b:'🟢 تغيير لون الخط'}];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
let AC,done=0;
function beep(seq){try{AC=AC||new(window.AudioContext||webkitAudioContext)();seq.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d)})}catch(e){}}
const okSnd=()=>beep([[880,0,.15],[1320,.1,.25]]);
const badSnd=()=>beep([[180,0,.18]]);
const winSnd=()=>beep([[660,0,.15],[880,.15,.15],[1100,.3,.15],[1320,.45,.4]]);
function build(){
 done=0;$('#win').classList.remove('on');$('#prog').textContent='0 / 4';
 const cols=shuf(PAIRS);
 const tS=$('#topSlots .fourcols'),bS=$('#botSlots .fourcols'),rw=$('#ribwrap');
 tS.innerHTML=bS.innerHTML=rw.innerHTML='';
 cols.forEach(p=>{
  tS.insertAdjacentHTML('beforeend',`<div class="fixedbox">${p.t}</div>`);
  bS.insertAdjacentHTML('beforeend',`<div class="slot" data-key="${p.k}"></div>`);
  rw.insertAdjacentHTML('beforeend','<div class="rib"></div>');
 });
 $('#botTray').innerHTML=shuf(PAIRS).map(p=>`<div class="chip" data-key="${p.k}">${p.b}</div>`).join('');
 document.querySelectorAll('#botTray .chip').forEach(arm);
}
function arm(chip){
 chip.addEventListener('pointerdown',e=>{
  if(chip.classList.contains('placed'))return;
  e.preventDefault();chip.setPointerCapture(e.pointerId);
  const r=chip.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
  chip.classList.add('dragging');
  const ghost=chip.cloneNode(true);ghost.classList.remove('dragging');ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:999;pointer-events:none;cursor:grabbing`;document.body.appendChild(ghost);
  function move(ev){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px'}
  function up(ev){
   document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
   ghost.style.display='none';const el=document.elementFromPoint(ev.clientX,ev.clientY);ghost.remove();
   chip.classList.remove('dragging');
   const slot=el&&el.closest('.slot');
   if(slot&&!slot.classList.contains('filled')){
    if(slot.dataset.key===chip.dataset.key){
     slot.classList.add('filled');slot.innerHTML=chip.innerHTML+'<span class="mark" style="color:var(--ok)">✅ صحيح</span>';
     chip.remove();okSnd();done++;$('#prog').textContent=done+' / 4';
     if(done===4){setTimeout(()=>{$('#win').classList.add('on');winSnd();burst()},250)}
    }else{
     slot.classList.add('flash-bad');badSnd();
     const m=document.createElement('span');m.className='mark';m.style.color='var(--bad)';m.textContent='❌ خطأ';
     slot.appendChild(m);setTimeout(()=>{slot.classList.remove('flash-bad');m.remove()},600);
    }
   }
  }
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
 });
}
function burst(){for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:50vw;top:40vh;background:${['#22d3ee','#7c5cff','#fbbf24','#16a34a'][i%4]};--x:${(Math.random()-.5)*500}px;--y:${(Math.random()-.5)*400}px`;document.body.append(c);setTimeout(()=>c.remove(),900)}}
$('#reset').onclick=build;$('#resetWin').onclick=build;
build();
</script></body></html>
